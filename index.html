<!doctype html>
<html lang="es" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    
    <!-- iOS PWA Viewport & Meta Tags -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Grind Tracker" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    
    <!-- Theme colors -->
    <meta name="theme-color" content="#FDFBF7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#131110" media="(prefers-color-scheme: dark)" />

    <!-- iOS Icons & PWA Manifest -->
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icon.svg" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Google Fonts: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <title>Grind Tracker - Registro de Moliendas de Café</title>
  </head>
  <body class="h-full bg-coffee-50 text-coffee-900 dark:bg-darkbg-base dark:text-coffee-100 antialiased selection:bg-coffee-200 dark:selection:bg-coffee-800">
    <div id="root" class="h-full flex flex-col"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Clean up legacy caches immediately
      if (window.caches) {
        caches.delete('molienda-cafe-v1').then((deleted) => {
          if (deleted) console.log('Caché antigua molienda-cafe-v1 eliminada.');
        });
      }

      // Register Service Worker for PWA
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then((reg) => {
            console.log('SW registrado:', reg.scope);
            reg.update();
          }).catch((err) => {
            console.log('Error registrando SW:', err);
          });

          // Reload page if a new service worker took control
          let refreshing = false;
          navigator.serviceWorker.addEventListener('controllerchange', () => {
            if (!refreshing) {
              refreshing = true;
              window.location.reload();
            }
          });
        });
      }
    </script>
  </body>
</html>
